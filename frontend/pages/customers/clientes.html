<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes - TallerGest</title>
  <link rel="stylesheet" href="clientes.css">
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <div class="migas">TallerGest / Clientes</div>
      <h1>Registro de clientes</h1>
    </header>

    <section class="tarjeta">
      <h2 id="tituloFormulario">Nuevo cliente</h2>
      <form id="formCliente" novalidate>
        <input type="hidden" id="clienteId">

        <div class="fila">
          <div class="campo">
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" maxlength="120" required>
          </div>
          <div class="campo">
            <label for="telefono">Telefono</label>
            <input type="tel" id="telefono" maxlength="30">
          </div>
        </div>

        <div class="fila">
          <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" maxlength="120">
          </div>
          <div class="campo">
            <label for="direccion">Direccion</label>
            <input type="text" id="direccion" maxlength="200">
          </div>
        </div>

        <div class="botones">
          <button type="submit" class="btn-principal" id="btnGuardar">Registrar cliente</button>
          <button type="button" class="btn-secundario" id="btnCancelar" hidden>Cancelar</button>
        </div>
        <p class="mensaje" id="mensaje" role="status"></p>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Listado de clientes</h2>
      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Telefono</th>
            <th>Correo</th>
            <th>Direccion</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaClientes"></tbody>
      </table>
      <p class="vacio" id="sinClientes">No hay clientes registrados.</p>
    </section>
  </main>

  <script src="clientes.js"></script>
</body>
</html>
